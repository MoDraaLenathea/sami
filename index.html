<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose & Lily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0514;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        function resize() {
            const size = Math.min(window.innerWidth, window.innerHeight);
            canvas.width = size;
            canvas.height = size;
        }
        resize();
        window.addEventListener('resize', resize);

        let time = 0;
        let bloom = 0;

        // Gambar kelopak mawar (lebih realistis)
        function drawRosePetal(cx, cy, angle, length, width, color, shade) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            const grad = ctx.createLinearGradient(0, 0, 0, -length);
            grad.addColorStop(0, shade);
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, 'rgba(255,255,255,0.35)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
                width * 0.9, -length * 0.2,
                width * 0.6, -length * 0.65,
                width * 0.1, -length
            );
            ctx.bezierCurveTo(
                -width * 0.2, -length * 0.75,
                -width * 0.7, -length * 0.3,
                0, 0
            );
            ctx.fill();
            ctx.restore();
        }

        // Gambar kelopak lily
        function drawLilyPetal(cx, cy, angle, length, width, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            const grad = ctx.createLinearGradient(0, 0, 0, -length);
            grad.addColorStop(0, '#fff5f0');
            grad.addColorStop(0.4, color);
            grad.addColorStop(1, '#ffd0d0');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(width * 0.6, -length * 0.4, 0, -length);
            ctx.quadraticCurveTo(-width * 0.6, -length * 0.4, 0, 0);
            ctx.fill();

            // Garis tengah kelopak
            ctx.strokeStyle = 'rgba(180, 60, 80, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(0, -length * 0.85);
            ctx.stroke();

            ctx.restore();
        }

        function drawRose(cx, cy, size) {
            const layers = [
                { n: 8,  r: 0.28, w: 0.14, color: '#e85a7a', shade: '#b83a5a' },
                { n: 10, r: 0.38, w: 0.16, color: '#f07090', shade: '#d04565' },
                { n: 12, r: 0.48, w: 0.18, color: '#ff8aaa', shade: '#e05575' },
                { n: 14, r: 0.58, w: 0.2,  color: '#ffb0c8', shade: '#f07090' }
            ];

            layers.forEach((layer, i) => {
                const p = Math.min(1, bloom * 1.6 - i * 0.15);
                if (p <= 0) return;

                for (let j = 0; j < layer.n; j++) {
                    const angle = (j / layer.n) * Math.PI * 2 + i * 0.15 + time * 0.00008;
                    drawRosePetal(
                        cx, cy,
                        angle,
                        size * layer.r * p,
                        size * layer.w * p,
                        layer.color,
                        layer.shade
                    );
                }
            });

            // Pusat mawar
            ctx.beginPath();
            ctx.fillStyle = '#8b2e4a';
            ctx.arc(cx, cy, size * 0.06 * bloom, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawLily(cx, cy, size, rotation = 0) {
            const petalCount = 6;
            const p = Math.min(1, bloom * 1.3);

            for (let i = 0; i < petalCount; i++) {
                const angle = (i / petalCount) * Math.PI * 2 + rotation;
                drawLilyPetal(
                    cx, cy,
                    angle,
                    size * 0.55 * p,
                    size * 0.18 * p,
                    '#ff9eb5'
                );
            }

            // Stamen (benang sari)
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + rotation;
                const x = cx + Math.cos(angle) * size * 0.12 * p;
                const y = cy + Math.sin(angle) * size * 0.12 * p;

                ctx.strokeStyle = '#c9a227';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(x, y);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = '#f0d060';
                ctx.arc(x, y, 3.5 * p, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pusat lily
            ctx.beginPath();
            ctx.fillStyle = '#ffd700';
            ctx.arc(cx, cy, size * 0.04 * p, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Background
            ctx.fillStyle = '#0a0514';
            ctx.fillRect(0, 0, w, h);

            // Glow lembut
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.5);
            glow.addColorStop(0, 'rgba(255, 120, 160, 0.12)');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);

            // Batang
            ctx.strokeStyle = '#1a4a1a';
            ctx.lineWidth = w * 0.016;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, cy + h * 0.08);
            ctx.quadraticCurveTo(cx - 20, cy + h * 0.3, cx, cy + h * 0.52);
            ctx.stroke();

            // Daun
            ctx.save();
            ctx.translate(cx - w * 0.14, cy + h * 0.25);
            ctx.rotate(-0.7);
            ctx.fillStyle = '#2d6b2d';
            ctx.beginPath();
            ctx.ellipse(0, 0, w * 0.05, w * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Gambar bunga
            drawRose(cx, cy - h * 0.02, w * 0.42);
            drawLily(cx - w * 0.28, cy + h * 0.05, w * 0.32, 0.3);
            drawLily(cx + w * 0.28, cy + h * 0.02, w * 0.3, -0.4);
        }

        function animate(t) {
            time = t;
            bloom = Math.min(1, bloom + 0.004);
            draw();
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
